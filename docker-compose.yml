services:
  backend:
    build: ./backend  
    container_name: infinitepay_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src 
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: infinitepay_web
    ports:
      - "8501:8501" 
    environment:
      - API_URL=http://backend:8000/api/chat
    volumes:
      - ./frontend:/app 
    depends_on:
      - backend 
    networks:
      - app-network

networks:
  app-network:
    driver: bridge